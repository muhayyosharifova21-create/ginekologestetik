<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <title>Ginekolog vrach Estetik Ginekolog | Doktor Surayyo Vahobjonovna</title>
  <meta name="description" content="Toshkentda malakali ginekolog va estetik ginekolog xizmatlari. Labioplastika, lazer vagina plastika, eroziya davolash.">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #9333ea;
      --primary-light: #c084fc;
      --accent: #f43f5e;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-card: rgba(255, 255, 255, 0.05);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; transition: all 0.3s ease; }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0b0f19;
      background-image: 
        radial-gradient(at 0% 0%, rgba(147, 51, 234, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(244, 63, 94, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .site-container {
      max-width: 1150px;
      margin: 0 auto;
      padding: 15px 12px 40px 12px;
    }

    /* STORIES SECTION (INSTAGRAM STYLE) */
    .stories-bar {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      padding: 10px 5px 20px 5px;
      scrollbar-width: none;
    }
    .stories-bar::-webkit-scrollbar { display: none; }

    .story-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .story-ring {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(45deg, #f43f5e, #9333ea, #c084fc);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .story-ring.add-admin {
      background: rgba(255, 255, 255, 0.2);
      border: 2px dashed var(--primary-light);
    }

    .story-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #0b0f19;
      background: #1e1b4b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
    }

    .story-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      max-width: 70px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* HERO CARD */
    .hero-creative-card {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 25px 18px 20px 18px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      margin-bottom: 25px;
    }

    .magazine-tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #f43f5e;
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.3);
      padding: 5px 14px;
      border-radius: 50px;
      margin-bottom: 12px;
    }

    .main-title {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, #c084fc 50%, #f43f5e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 10px 0;
    }

    /* ACTION BUTTONS GRID */
    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 30px;
    }

    .action-card {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      text-align: center;
      color: #fff;
    }
    .action-card:hover {
      background: rgba(147, 51, 234, 0.2);
      border-color: var(--primary-light);
      transform: translateY(-2px);
    }
    .action-card.live {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.25), rgba(147, 51, 234, 0.25));
      border-color: rgba(244, 63, 94, 0.5);
    }
    .action-card svg {
      width: 26px;
      height: 26px;
      fill: var(--primary-light);
    }
    .action-card.live svg { fill: #f43f5e; }
    .action-card span { font-weight: 700; font-size: 0.85rem; }

    /* ADMIN MODAL LOGIN */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .admin-modal {
      background: #1e1b4b;
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      padding: 25px;
      color: #fff;
    }

    .admin-modal h3 { margin-top: 0; font-size: 1.3rem; text-align: center; }
    .admin-modal input, .admin-modal textarea {
      width: 100%;
      padding: 12px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: #fff;
      margin-bottom: 12px;
      font-family: inherit;
    }
    .admin-modal button {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    @media (min-width: 768px) {
      .action-grid { grid-template-columns: repeat(4, 1fr); }
      .main-title { font-size: 3.2rem; }
    }
  </style>
</head>
<body>

  <div class="site-container">

    <!-- TOP STORY'LAR BO'LIMI -->
    <div class="stories-bar">
      <!-- Vrach Admin Tugmasi -->
      <div class="story-item" onclick="openAdminModal()">
        <div class="story-ring add-admin">
          <div class="story-avatar">+</div>
        </div>
        <span class="story-title" style="color:var(--primary-light);">Admin (Vrach)</span>
      </div>

      <!-- Storylar ro'yxati -->
      <div class="story-item" onclick="viewStory('Labioplastika Aksiya', 'Bugun labioplastika muolajasiga 20% chegirma e\'lon qilindi!')">
        <div class="story-ring">
          <div class="story-avatar">🔥</div>
        </div>
        <span class="story-title">Aksiya</span>
      </div>

      <div class="story-item" onclick="viewStory('Jonli Efir', 'Bugun soat 20:00 da sistit va uni davolash haqida jonli efir bo\'ladi!')">
        <div class="story-ring">
          <div class="story-avatar">🔴</div>
        </div>
        <span class="story-title">Efir Bugun</span>
      </div>
    </div>

    <!-- HERO HEADER -->
    <header class="hero-creative-card">
      <div class="magazine-tag">DOCTOR PLATFORM • 2026</div>
      <h1 class="main-title">Estetik Ginekologiya</h1>
      <p style="color:#e2e8f0; margin-bottom:15px;">Doktor Surayyo Vahobjonovna</p>
    </header>

    <!-- TEZKOR ACTION TUGMALARI -->
    <div class="action-grid">
      <div class="action-card live" onclick="alert('Jonli efir tez orada boshlanadi!')">
        <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        <span>Jonli Efir</span>
      </div>

      <div class="action-card" onclick="alert('Rasm va videolar bo\'limi')">
        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        <span>Storylar</span>
      </div>

      <div class="action-card" onclick="alert('Like va Izohlar ochiq!')">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <span>Reaksiyalar</span>
      </div>

      <div class="action-card" onclick="toggleChat()">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        <span>Shaxsiy Chat</span>
      </div>
    </div>

  </div>

  <!-- ADMIN LOGIN VA KABINET MODALI -->
  <div class="modal-overlay" id="adminModal">
    <div class="admin-modal">
      <h3 id="modalTitle">👩‍⚕️ Shifokor Kabineti</h3>
      <div id="loginForm">
        <input type="password" id="adminPassword" placeholder="Admin parolini kiriting...">
        <button onclick="checkAdminPassword()">Kirish</button>
      </div>
      <div id="adminPanel" style="display:none;">
        <p style="color:#10b981; font-weight:bold;">✅ Xush kelibsiz, Doktor!</p>
        <hr style="border-color:var(--glass-border); margin-bottom:15px;">
        <p style="font-size:0.85rem;">📸 <b>Yangi Story / E'lon berish:</b></p>
        <input type="text" id="storyTitleInput" placeholder="Story sarlavhasi...">
        <textarea id="storyContentInput" placeholder="Matin yoki e'lon matni..."></textarea>
        <button onclick="addNewStory()">Story Nashr Qilish</button>
        <button onclick="closeAdminModal()" style="background:#64748b; margin-top:8px;">Yopish</button>
      </div>
    </div>
  </div>

  <script>
    // ADMIN TIZIMI LOGIKASI
    function openAdminModal() {
      document.getElementById('adminModal').style.display = 'flex';
    }

    function closeAdminModal() {
      document.getElementById('adminModal').style.display = 'none';
    }

    function checkAdminPassword() {
      const pass = document.getElementById('adminPassword').value;
      if (pass === 'doctor2026' || pass === 'surayyo') { // Parol: doctor2026
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
      } else {
        alert('❌ Noto\'g'ri parol!');
      }
    }

    function addNewStory() {
      const title = document.getElementById('storyTitleInput').value;
      const content = document.getElementById('storyContentInput').value;

      if (!title || !content) {
        alert('Iltimos, barcha maydonlarni to\'ldiring!');
        return;
      }

      alert('✅ Story muvaffaqiyatli joylandi!');
      closeAdminModal();
    }

    function viewStory(title, text) {
      alert(`📸 STORY: ${title}\n\n${text}`);
    }
  </script>
</body>
</html>
